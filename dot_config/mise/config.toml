#schema = "https://mise.jdx.dev/schema/mise.json"

# you can set these with `mise use -g`
[tools]
bun = "latest"
gh = "latest"
go = "latest"
node = "lts"
oh-my-pi = { version = "latest", rename_exe = "omp" }
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
postgres = "18"
python = "latest"
ruby = "latest"
usage = "latest"
uv = "latest"

[settings]
trusted_config_paths = ['~/dev', '~/code/personal']
yes = false # set to true to automatically answer yes to all prompts
idiomatic_version_file_enable_tools = ["ruby"]
minimum_release_age_excludes = ["gh", "opencode", "ruby"]
minimum_release_age = "6h" # 24 hrs default

[settings.upgrade]
prune_after = "6h"

[settings.self_update]
auto = true

[tasks.gems]
alias = "g"
description = "Upgrade gem and Install gems"
run = [
  "gem update --system",
  "gem install bundler bundler-audit rails rubocop"
]

[tasks.npm]
alias = "n"
description = "Upgrade npm and Install packages"
run = [
  "npm install -g npm pnpm",
  "npm install -g yarn npm-check-updates is-my-node-vulnerable npkill retire portless"
]

[tasks.pip]
alias = "p"
description = "Upgrade pip"
run = [
  "pip install --upgrade pip",
  "pip install --upgrade pipenv pip-audit"
]
