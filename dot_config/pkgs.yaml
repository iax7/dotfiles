---
# App list for `pkgs`. Each key is a package manager, its value the package name.
#   name: app      alias of `all`: that name for every normal manager
#   all: app       same (named manager wins, then all, then name)
#   manager: app   that manager with a different package name
# Without name/all the app only exists in the managers you name: no `false` needed.
# aur and brew-cask do not inherit from name/all; they only list what they declare.
# brew = formulas, brew-cask = casks, aur = AUR (yay).
# vim: set ft=yaml ts=2 sw=2:

